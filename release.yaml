apiVersion: v1
kind: Namespace
metadata:
  name: node-mongo-app

---

# Node.js Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
  namespace: node-mongo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
        - name: node
          image: your-dockerhub-user/node-app:latest
          ports:
            - containerPort: 3000

---

# Node.js Service
apiVersion: v1
kind: Service
metadata:
  name: node-service
  namespace: node-mongo-app
spec:
  selector:
    app: node
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP

---

# MongoDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: node-mongo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          ports:
            - containerPort: 27017

---

# MongoDB Service
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: node-mongo-app
spec:
  selector:
    app: mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP
